<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - FitPlace</title>
    <link rel="stylesheet" href="assets/css/recuperar-senha.css">
</head>
<body>
    <div class="banner">
        <img src="assets/img/banner (1).png" alt="Banner FitPlace">
    </div>

    <main class="conteudo">
        <div class="bloco-cinza">
            <h1>Recupere sua senha!</h1>
            <p>Digite seu e-mail para receber instruções de redefinição de senha</p>
            
            <input type="email" placeholder="Digite seu e-mail">
            
            <button class="botao-laranja">ENVIAR</button>

            <div class="ou">OU</div>

            <button class="botao-google">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18">
                Usar minha conta google
            </button>
        </div>

        <a href="#" class="voltar">← Voltar para login</a>
    </main>
    <footer class="rodape">
        <img src="assets/img/logo-fitplace.png" width="80" alt="Logo">
        <div class="texto-rodape">
            <p>© Todos os direitos reservados.</p>
            <p>FITPLACE Academia de Ginástica S/A</p>
        </div>
    </footer>

</body>
</html>
